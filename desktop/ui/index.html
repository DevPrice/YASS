<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Nothing in this window loads from the network, so nothing is allowed to.
      It is a page with a bridge to the filesystem and to the server's own
      lifecycle; the tightest policy it can run under is the right one.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'"
    />
    <title>YASS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

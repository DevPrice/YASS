# A single file per platform — one you can hand to somebody, or drop on the
# machine that runs the party, with nothing to install and nothing left behind
# but a settings file and a cache directory it can rebuild: `%APPDATA%\yass`
# and `%LOCALAPPDATA%\yass` on Windows, `~/.config/yass` and `~/.cache/yass`
# on Linux.
#
# A portable .exe on Windows and an AppImage on Linux, which is the same idea
# twice: self-contained, `chmod +x` and run, no package manager involved.
appId: com.yarg.yass
productName: YASS
copyright: ''

directories:
  output: ../dist
  buildResources: build

# Ship one language, not fifty-five.
#
# Electron carries a `.pak` of translated Chromium strings per locale — 49 MB
# unpacked and ~8 MB of the shipped executable, the single largest thing in the
# build that is not Chromium itself. They translate Chromium's own UI: context
# menus, the certificate errors, the print dialog. This app has one frameless
# window with `setMenu(null)` on it and never navigates, so none of that surface
# is reachable, and the popover's own strings are in the bundle either way.
#
# The cost is that Chromium's built-in menus would be English on a non-English
# machine. There are no such menus here.
electronLanguages:
  - en-US

# Removes the DirectX shader compiler after the runtime is copied but before it
# is packaged; see the script for what it takes and what it deliberately leaves.
afterPack: scripts/prune-runtime.mjs

# Main, preload and the popover's built UI go inside the asar: only Electron
# reads them, and its patched `fs` handles the archive transparently. The icon
# rides along because the tray reads it at runtime through `nativeImage`, which
# understands asar paths.
files:
  - dist/**/*
  - build/icon.ico
  - build/icon.png
  - package.json

# These two stay *outside* the asar, and that is the whole point of listing
# them here. The server is a real Node process spawned from a path — plain Node
# cannot load a module out of an asar archive — and its static file handler
# reads the client with `stat` and `createReadStream`, which want ordinary
# files rather than synthetic archive entries.
#
# `.mjs` on the way in: the bundle is ESM only because `server/package.json`
# sits next to it saying so, and that file does not come along. The extension
# is what carries the module system into the packaged layout.
#
# The three licence files ride along for a plainer reason: two of them are
# obligations. The popover's woff2 faces are SIL OFL, which requires the notice
# to travel with the fonts, and the genre normaliser inside the server bundle is
# ported from YARG's LGPL-3.0 source. A build that carries the code and leaves
# the terms behind in the repository is not distributing the same thing it was
# given. See THIRD-PARTY-NOTICES.md.
extraResources:
  - from: ../server/dist/index.js
    to: server/index.mjs
  - from: ../client/dist
    to: client
    # Without the sourcemap, which is 1.5 MB of the client build and of use to
    # exactly nobody here: it is only ever fetched by a devtools window, and the
    # people opening this app are guests on their phones. It stays in
    # `client/dist` for a local `npm run build`, so debugging the client against
    # a dev server is unaffected — only the copy inside the installer loses it.
    #
    # The `sourceMappingURL` comment stays behind in the JS and now points at a
    # file that isn't there. That is a 404 in a devtools panel nobody opens, and
    # stripping it would mean post-processing the client's build output from the
    # desktop workspace, which is a worse trade than the 404.
    filter:
      - '**/*'
      - '!**/*.map'
  - from: ../LICENSE
    to: LICENSE
  - from: ../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: ui/fonts/OFL.txt
    to: fonts-OFL.txt

asar: true

win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico

portable:
  # Unversioned, because a developer building this repeatedly wants one path
  # that keeps working — a pinned shortcut, a firewall rule, a script — rather
  # than a new filename every time the manifests move. `dist/YASS.exe` is
  # overwritten in place by the next `npm run dist`.
  #
  # Releases are the other case entirely, and there the version is the point:
  # a file called `YASS.exe` sitting in somebody's Downloads folder is not
  # datable against a bug report. `.github/scripts/stamp-version.mjs` rewrites
  # this line to `YASS-${version}.exe` on the runner when a tag is being
  # packaged, so the name below is what a person building locally gets and the
  # versioned one is what the releases page gets. Neither is committed.
  artifactName: YASS.exe

  # A fixed extraction directory, and the reason is Windows Firewall.
  #
  # A portable build is a self-extracting stub: it unpacks into `%TEMP%\<dir>`,
  # runs `YASS.exe` from there, and deletes the directory on exit. Left to
  # itself electron-builder names that directory with a fresh KSUID *per build*
  # — so every rebuild runs the server from a path Windows has never seen. The
  # firewall matches rules by program path and nothing else, so each rebuild
  # earns a brand-new "allow access?" prompt and leaves the last build's rule
  # behind as landfill.
  #
  # Naming it pins the path across rebuilds: allow it once, and the rule keeps
  # matching no matter how many times the exe underneath is replaced.
  #
  # The cost is that two copies cannot run at once — the stub wipes this
  # directory before extracting into it, so a second launch pulls the files out
  # from under the first. That was already true of two copies of the same
  # build; this extends it to two *different* builds, which is a thing only a
  # developer does, and cheaply undone by bumping the name.
  unpackDirName: YASS

# AppImage is the Linux answer to the portable .exe: a single file carrying its
# own runtime, run from wherever it was downloaded to. It needs FUSE to mount
# itself, which most desktops have and Ubuntu 24.04 does not ship by default —
# `--appimage-extract-and-run` is the way out of that, and the README says so.
linux:
  target:
    - target: AppImage
      arch: [x64]
  # PNG, not the ICO: this is what fills the desktop entry and what the tray
  # reads at runtime. `scripts/make-icon.mjs` writes both.
  icon: build/icon.png
  # Spelled out because the default is the *package* name, and this package is
  # `@yass/desktop` — which electron-builder sanitises to `@yassdesktop` and
  # then refuses, a scope marker being no kind of filename. Lowercase because
  # this is a Linux binary, and it is what `Icon=` in the autostart entry
  # written by `src/autostart.ts` resolves against.
  executableName: yass
  category: AudioVideo
  synopsis: Song browser for YARG
  description: >-
    A song browser for YARG, served to the phones at your party. Runs beside the
    game and reads its library from YARG's own song cache.

appImage:
  # Same rule as the portable .exe above, including the arch marker: a local
  # build is `YASS.AppImage`, and the release is stamped up to
  # `YASS-${version}-x86_64.AppImage`. The arch only earns its place next to a
  # version, on a page offering more than one file.
  artifactName: YASS.AppImage

# Typechecks, tests and packages every push to master.
#
# One job, on Windows, which is not the obvious choice for work that is mostly
# platform agnostic — the checks would be faster and cheaper on Linux. Two
# things pull them onto the same runner as the packaging:
#
#  - `desktop` only targets Windows, and electron-builder only produces that
#    portable .exe on Windows without Wine underneath it.
#  - The songcache tests are written in Windows paths. `resolveRelative` in
#    server/src/media/cache.ts joins with the host's path rules, which is right
#    in production — YARG writes songcache.bin on the machine that reads it —
#    but it means a fixture full of `C:\charts` resolves to nonsense on Linux.
#
# So the checks run where the app runs. Splitting them back onto Linux means
# building those fixtures out of the host's separators first.
name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

# A push that supersedes another on the same branch makes the older run's
# artifact stale before it finishes uploading.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `lib/sources.ts` reads YARG's OpenSource registry out of
          # vendor/opensource at build time — without the submodule the client
          # build fails on a missing `@opensource/base/index.json`.
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          # 22, not the 20 the engines field floors at. The test scripts hand
          # `src/**/*.test.ts` to `node --test` still quoted, so no shell ever
          # expands it and the test runner has to do the globbing itself —
          # which it only learned to do in 22. The app itself still runs on 20.
          node-version: '22'
          cache: npm

      # No skipping the Electron binary: electron-builder packages the runtime
      # into the .exe and reads the exact version from the installed package.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Client, server, tray, then electron-builder over the lot of it — `dist`
      # runs the builds itself, so there is no separate build step above. Lands
      # in dist/ at the repository root; see desktop/electron-builder.yml.
      - run: npm run dist

      - uses: actions/upload-artifact@v7
        with:
          name: YASS-portable
          path: dist/YASS-*.exe
          if-no-files-found: error

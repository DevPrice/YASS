# Every push to master, checked and packaged on both platforms. The work is in
# build.yml, which release.yml calls too — so a release ships the same artifact
# this has been building all along, put together the same way.
name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

# A push that supersedes another on the same branch makes the older run's
# artifacts stale before they finish uploading.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # No version input: CI packages whatever the package.json files say, which
    # is the point of them saying it.
    uses: ./.github/workflows/build.yml
